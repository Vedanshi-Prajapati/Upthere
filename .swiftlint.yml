only_rules:
  - line_length
  - file_length
  - function_body_length
  - force_unwrapping
  - force_try
  - custom_rules

line_length:
  warning: 140
  error: 250

file_length:
  warning: 400
  error: 2000

function_body_length:
  warning: 60
  error: 500

force_unwrapping: error

force_try:
  severity: error

custom_rules:
  no_print:
    name: "No print"
    regex: "(?<![a-zA-Z0-9_])print\\("
    message: "Direct print() calls are disallowed. Use Logger or OSLog."
    severity: error

excluded:
  - .build
  - DerivedData
  - scripts
