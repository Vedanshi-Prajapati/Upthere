name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SwiftLint (pinned binary)
        run: |
          if ! command -v swiftlint &> /dev/null; then
            SWIFTLINT_URL="https://github.com/realm/SwiftLint/releases/download/0.58.2/portable_swiftlint.zip"
            curl -sL --retry 3 "$SWIFTLINT_URL" -o /tmp/swiftlint.zip
            sudo unzip -q -o /tmp/swiftlint.zip -d /usr/local/bin
          fi
          swiftlint version

      - name: Run SwiftLint
        run: swiftlint lint

  unit-tests:
    name: Unit tests
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/*.swift', 'Upthere.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Ensure iOS 26 simulator runtime
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -q "iOS 26"; then
            echo "iOS 26 runtime not found. Downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
            xcrun simctl list runtimes
          fi
          if ! xcrun simctl list runtimes | grep -q "iOS 26"; then
            echo "::error::iOS 26 simulator runtime is still missing after download."
            exit 1
          fi

      - name: Select iOS 26 simulator
        id: select-simulator
        run: |
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -q "iOS 26"; then
            echo "::error::No iOS 26 simulator runtime found on this runner."
            exit 1
          fi
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin).get('devices', {})
          for rt,devs in sorted(d.items(), reverse=True):
              if 'iOS-26' in rt or 'iOS 26' in rt:
                  for x in devs:
                      if x.get('isAvailable', False):
                          print(x['udid']); sys.exit(0)
          sys.exit(1)
          ")
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available simulator found for iOS 26 runtime."
            exit 1
          fi
          echo "Selected simulator UDID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: |
          rm -rf TestResults.xcresult
          xcodebuild test \
            -scheme Upthere \
            -destination "id=${{ steps.select-simulator.outputs.device_id }}" \
            -only-testing:UpthereTests \
            -resultBundlePath TestResults.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  build-release:
    name: Build Release
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
