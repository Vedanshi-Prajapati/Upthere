          restore-keys: |
            ${{ runner.os }}-xcode-release-

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Ensure iOS 26 simulator runtime
        run: |
          xcodebuild -version
