name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SwiftLint (pinned binary)
        run: |
          if ! command -v swiftlint &> /dev/null; then
            SWIFTLINT_URL="https://github.com/realm/SwiftLint/releases/download/0.58.2/portable_swiftlint.zip"
            curl -sL --retry 3 "$SWIFTLINT_URL" -o /tmp/swiftlint.zip
            sudo unzip -q -o /tmp/swiftlint.zip -d /usr/local/bin
          fi
          swiftlint version

      - name: Run SwiftLint
        run: swiftlint lint

  unit-tests:
    name: Unit tests
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/*.swift', 'Upthere.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      - name: Select Xcode 26
        run: |
          FOUND_XCODE=""
          for app in /Applications/Xcode_26*.app /Applications/Xcode-26*.app; do
            if [ -d "$app" ]; then
              FOUND_XCODE="$app"
              break
            fi
          done

          if [ -z "$FOUND_XCODE" ] && [ -d "/Applications/Xcode.app" ]; then
            VERSION=$(defaults read /Applications/Xcode.app/Contents/Info.plist CFBundleShortVersionString 2>/dev/null || echo "")
            if [[ "$VERSION" =~ ^26\. ]]; then
              FOUND_XCODE="/Applications/Xcode.app"
            fi
          fi

          if [ -z "$FOUND_XCODE" ]; then
            echo "::error::No Xcode 26 installation found in /Applications (looked for Xcode_26*.app and Xcode-26*.app)."
            exit 1
          fi

          echo "Selecting Xcode 26 at $FOUND_XCODE"
          sudo xcode-select -s "$FOUND_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Find available iPhone simulator
        id: select-simulator
        run: |
          xcrun simctl list runtimes
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in sorted(d.items(), reverse=True):
              if 'iOS-26' in rt:
                  for x in devs:
                      if 'iPhone' in x['name'] and x['isAvailable']:
                          print(x['udid']); sys.exit()
          ")
          [ -z "$DEVICE_ID" ] && { echo '::error::No iOS 26 iPhone simulator'; exit 1; }
          echo "Selected iPhone simulator UDID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: |
          rm -rf TestResults.xcresult
          xcodebuild test \
            -scheme Upthere \
            -destination "id=${{ steps.select-simulator.outputs.device_id }}" \
            -only-testing:UpthereTests \
            -resultBundlePath TestResults.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  build-release:
    name: Build Release
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-release-${{ hashFiles('**/*.swift', 'Upthere.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-release-

      - name: Select Xcode 26
        run: |
          FOUND_XCODE=""
          for app in /Applications/Xcode_26*.app /Applications/Xcode-26*.app; do
            if [ -d "$app" ]; then
              FOUND_XCODE="$app"
              break
            fi
          done

          if [ -z "$FOUND_XCODE" ] && [ -d "/Applications/Xcode.app" ]; then
            VERSION=$(defaults read /Applications/Xcode.app/Contents/Info.plist CFBundleShortVersionString 2>/dev/null || echo "")
            if [[ "$VERSION" =~ ^26\. ]]; then
              FOUND_XCODE="/Applications/Xcode.app"
            fi
          fi

          if [ -z "$FOUND_XCODE" ]; then
            echo "::error::No Xcode 26 installation found in /Applications (looked for Xcode_26*.app and Xcode-26*.app)."
            exit 1
          fi

          echo "Selecting Xcode 26 at $FOUND_XCODE"
          sudo xcode-select -s "$FOUND_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build Release App
        run: |
          xcodebuild build \
            -scheme Upthere \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release Widgets
        run: |
          xcodebuild build \
            -scheme UpthereWidgets \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO

  ui-tests:
    name: UI tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/*.swift', 'Upthere.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      - name: Select Xcode 26
        run: |
          FOUND_XCODE=""
          for app in /Applications/Xcode_26*.app /Applications/Xcode-26*.app; do
            if [ -d "$app" ]; then
              FOUND_XCODE="$app"
              break
            fi
          done

          if [ -z "$FOUND_XCODE" ] && [ -d "/Applications/Xcode.app" ]; then
            VERSION=$(defaults read /Applications/Xcode.app/Contents/Info.plist CFBundleShortVersionString 2>/dev/null || echo "")
            if [[ "$VERSION" =~ ^26\. ]]; then
              FOUND_XCODE="/Applications/Xcode.app"
            fi
          fi

          if [ -z "$FOUND_XCODE" ]; then
            echo "::error::No Xcode 26 installation found in /Applications (looked for Xcode_26*.app and Xcode-26*.app)."
            exit 1
          fi

          echo "Selecting Xcode 26 at $FOUND_XCODE"
          sudo xcode-select -s "$FOUND_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Find available iPhone simulator
        id: select-simulator
        run: |
          xcrun simctl list runtimes
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in sorted(d.items(), reverse=True):
              if 'iOS-26' in rt:
                  for x in devs:
                      if 'iPhone' in x['name'] and x['isAvailable']:
                          print(x['udid']); sys.exit()
          ")
          [ -z "$DEVICE_ID" ] && { echo '::error::No iOS 26 iPhone simulator'; exit 1; }
          echo "Selected iPhone simulator UDID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run UI Tests
        run: |
          rm -rf TestResults.xcresult
          xcodebuild test \
            -scheme Upthere \
            -destination "id=${{ steps.select-simulator.outputs.device_id }}" \
            -only-testing:UpthereUITests \
            -resultBundlePath TestResults.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
