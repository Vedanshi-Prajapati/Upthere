name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SwiftLint (pinned binary)
        run: |
          if ! command -v swiftlint &> /dev/null; then
            SWIFTLINT_URL="https://github.com/realm/SwiftLint/releases/download/0.58.2/portable_swiftlint.zip"
            SWIFTLINT_SHA256="ad071d5a36d7f4376dfe92d7ed9f4baef8b3bde75b75131dc287cf34f10353a5"
            curl -sL --retry 3 "$SWIFTLINT_URL" -o /tmp/swiftlint.zip
            echo "$SWIFTLINT_SHA256  /tmp/swiftlint.zip" | shasum -a 256 -c -
            sudo unzip -q -o /tmp/swiftlint.zip -d /usr/local/bin
          fi
          swiftlint version

      - name: Run SwiftLint
        run: swiftlint lint

  unit-tests:
    name: Unit tests
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/*.swift', 'Upthere.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Ensure iOS simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS"; then
            echo "No iOS simulator runtime found. Downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Select iOS simulator
        id: select-simulator
        run: |
          xcrun simctl list runtimes
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin).get('devices', {})
          for rt,devs in sorted(d.items(), reverse=True):
              if any(v in rt for v in ['iOS-27', 'iOS 27', 'iOS-26', 'iOS 26']):
                  iphones = [x for x in devs if 'iPhone' in x.get('name', '') and x.get('isAvailable', False)]
                  iphones.sort(key=lambda x: x.get('name', ''), reverse=True)
                  if iphones:
                      print(iphones[0]['udid']); sys.exit(0)
          for rt,devs in sorted(d.items(), reverse=True):
              if 'iOS' in rt:
                  iphones = [x for x in devs if 'iPhone' in x.get('name', '') and x.get('isAvailable', False)]
                  iphones.sort(key=lambda x: x.get('name', ''), reverse=True)
                  if iphones:
                      print(iphones[0]['udid']); sys.exit(0)
          sys.exit(1)
          ")
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator found for iOS 26 or iOS 27."
            exit 1
          fi
          echo "Selected simulator UDID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: |
          rm -rf TestResults.xcresult
          xcodebuild test \
            -scheme Upthere \
            -destination "id=${{ steps.select-simulator.outputs.device_id }}" \
            -only-testing:UpthereTests \
            -resultBundlePath TestResults.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  build-release:
    name: Build Release
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-release-${{ hashFiles('**/*.swift', 'Upthere.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-release-

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Ensure iOS simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS"; then
            echo "No iOS simulator runtime found. Downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Select iOS simulator
        id: select-simulator
        run: |
          xcrun simctl list runtimes
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin).get('devices', {})
          for rt,devs in sorted(d.items(), reverse=True):
              if any(v in rt for v in ['iOS-27', 'iOS 27', 'iOS-26', 'iOS 26']):
                  iphones = [x for x in devs if 'iPhone' in x.get('name', '') and x.get('isAvailable', False)]
                  iphones.sort(key=lambda x: x.get('name', ''), reverse=True)
                  if iphones:
                      print(iphones[0]['udid']); sys.exit(0)
          for rt,devs in sorted(d.items(), reverse=True):
              if 'iOS' in rt:
                  iphones = [x for x in devs if 'iPhone' in x.get('name', '') and x.get('isAvailable', False)]
                  iphones.sort(key=lambda x: x.get('name', ''), reverse=True)
                  if iphones:
                      print(iphones[0]['udid']); sys.exit(0)
          sys.exit(1)
          ")
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator found for iOS 26 or iOS 27."
            exit 1
          fi
          echo "Selected simulator UDID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build Release App
        run: |
          xcodebuild build \
            -scheme Upthere \
            -configuration Release \
            -destination "id=${{ steps.select-simulator.outputs.device_id }}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release Widgets
        run: |
          xcodebuild build \
            -scheme UpthereWidgets \
            -configuration Release \
            -destination "id=${{ steps.select-simulator.outputs.device_id }}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO

  ui-tests:
    name: UI tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/*.swift', 'Upthere.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Ensure iOS simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS"; then
            echo "No iOS simulator runtime found. Downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Select iOS simulator
        id: select-simulator
        run: |
          xcrun simctl list runtimes
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin).get('devices', {})
          for rt,devs in sorted(d.items(), reverse=True):
              if any(v in rt for v in ['iOS-27', 'iOS 27', 'iOS-26', 'iOS 26']):
                  iphones = [x for x in devs if 'iPhone' in x.get('name', '') and x.get('isAvailable', False)]
                  iphones.sort(key=lambda x: x.get('name', ''), reverse=True)
                  if iphones:
                      print(iphones[0]['udid']); sys.exit(0)
          for rt,devs in sorted(d.items(), reverse=True):
              if 'iOS' in rt:
                  iphones = [x for x in devs if 'iPhone' in x.get('name', '') and x.get('isAvailable', False)]
                  iphones.sort(key=lambda x: x.get('name', ''), reverse=True)
                  if iphones:
                      print(iphones[0]['udid']); sys.exit(0)
          sys.exit(1)
          ")
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator found for iOS 26 or iOS 27."
            exit 1
          fi
          echo "Selected simulator UDID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run UI Tests
        run: |
          rm -rf TestResults.xcresult
          xcodebuild test \
            -scheme Upthere \
            -destination "id=${{ steps.select-simulator.outputs.device_id }}" \
            -only-testing:UpthereUITests \
            -resultBundlePath TestResults.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  archive:
    name: Archive App
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-archive-${{ hashFiles('**/*.swift', 'Upthere.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-archive-

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Archive Upthere
        run: |
          xcodebuild archive \
            -scheme Upthere \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Upthere.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
